<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the world of Techwithsameer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;

            .social-buttons{
                margin-top: 20px;
            }    

            .social-buttons a{
                background-color: white;
                color: black;
                padding: 10px 20px;
                border-radius: 10px;
                text-decoration: none;
                font-weight: bold;
                display: inline-block;
                cursor: pointer;
            }    
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 640px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            display: inline-block;
            margin: 1rem 0 2rem;
            padding: 0.4rem 1.2rem;
            border: 1px solid #7b2ff7;
            border-radius: 999px;
            font-size: 0.9rem;
            color: #c4b5fd;
            letter-spacing: 0.05em;
        }
        .cards {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem 1.8rem;
            min-width: 150px;
            flex: 1;
        }
        .card span {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #9ca3af;
            margin-bottom: 0.4rem;
        }
        .card strong {
            font-size: 1.25rem;
            color: #f9fafb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Techwithsameer</h1>
        <div class="badge">Future Devops & Ai Enjineer</div>
        <div class="cards">
            <div class="card">
                <span>Devops</span>
                <strong>Docker</strong>
            </div>
            <div class="card">
                <span>Cloud</span>
                <strong>AWS</strong>
            </div>
            <div class="card">
                <span>AI</span>
                <strong>Generative AI</strong>
            </div>
            <div class="social-buttons">
                <a href="https://github.com/Sameer-Infra" target="_blank">Github</a>       
        </div>
    </div>
</body>
</html>
